name: release

# 推送 v* 标签发布 KidWall 全平台产物：
# win-x64 用 Inno Setup 生成中文安装包（NativeAOT）；
# linux-x64 / linux-arm64 / osx-x64 / osx-arm64 发布 NativeAOT 安装包（deb/dmg + SHA-256）。
# 壁纸设置在 Linux 上尚未适配，应用内会给出「正在开发中」的友好提示。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v），例如 1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 测试
        run: dotnet test KidWall.slnx -c Release

  publish:
    name: 发布 ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            arch: x64
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-14
          - rid: osx-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 NativeAOT 依赖 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 计算版本号
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Tag must be a numeric version (for example v1.0.0): $version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "版本：$version"

      # Windows / Linux / macOS：NativeAOT 自包含；macOS 保留符号（ld_classic 不支持压缩调试段）。
      - name: 发布
        shell: pwsh
        run: pwsh scripts/publish.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version $env:APP_VERSION

      - name: 构建 Windows 安装包
        if: runner.os == 'Windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: scripts/KidWall.iss
          options: >-
            /DAppVersion=${{ env.APP_VERSION }}
            /DAppArch=${{ matrix.arch }}
            /DSourceDir=${{ github.workspace }}\artifacts\publish\${{ matrix.rid }}\KidWall.App
            /DOutputDir=${{ github.workspace }}\artifacts\release

      - name: 计算安装包 SHA-256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installerName = "KidWall-v$env:APP_VERSION-win-x64-setup.exe"
          $installerPath = Join-Path "artifacts/release" $installerName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Installer was not produced: $installerPath"
          }
          $sha = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $installerName" | Set-Content -LiteralPath "$installerPath.sha256" -Encoding ASCII

      - name: 打包 Linux deb 安装包
        if: runner.os == 'Linux'
        shell: pwsh
        run: pwsh scripts/package_linux_deb.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version $env:APP_VERSION -Force

      - name: 打包 macOS dmg 安装镜像
        if: runner.os == 'macOS'
        shell: bash
        run: chmod +x scripts/package_macos_dmg.sh && ./scripts/package_macos_dmg.sh '${{ matrix.rid }}' "$APP_VERSION"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: KidWall-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: KidWall-*
          path: artifacts/release
          merge-multiple: true

      - name: 计算版本号
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
            $tagName = "v$version"
          } else {
            # 沿用被推送的原始标签，避免额外创建新标签。
            $tagName = '${{ github.ref_name }}'
            $version = $tagName.TrimStart('v', 'V')
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 准备发布说明
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          # 优先使用手工维护的版本说明，否则退回简单的版本标题
          $curated = ".github/release-notes/v$env:VERSION.md"
          $bodyPath = "artifacts/release-body.md"
          New-Item -ItemType Directory -Path (Split-Path -Parent $bodyPath) -Force | Out-Null
          if (Test-Path -LiteralPath $curated -PathType Leaf) {
            Copy-Item -LiteralPath $curated -Destination $bodyPath -Force
            Write-Host "使用发布说明：$curated"
          }
                    # 附注 tag 的说明就是发布说明（Release 页直接可读，不点开 tag 也能看到）
                    git fetch --quiet --tags origin 2>$null
                    $tagMessage = git tag -l "$env:TAG_NAME" --format='%(contents)'
                    if (-not [string]::IsNullOrWhiteSpace($tagMessage)) {
                      $tagMessage | Set-Content -LiteralPath $bodyPath -Encoding utf8
                      Write-Host "使用附注 tag 说明作为发布说明。"
                    }
                    else {
        
            "KidWall v$env:VERSION" | Set-Content -LiteralPath $bodyPath -Encoding utf8
            Write-Host "未找到 $curated，将只使用自动生成的变更说明。"
          }

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: KidWall v${{ steps.version.outputs.version }}
          body_path: artifacts/release-body.md
          generate_release_notes: true
          files: |
            artifacts/release/*.exe
            artifacts/release/*.deb
            artifacts/release/*.dmg
            artifacts/release/*.zip
            artifacts/release/*.sha256
