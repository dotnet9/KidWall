name: release

# 推送 v* 标签发布 KidWall Windows 安装包（win-x64 / win-x86，Inno Setup 中文向导）。
# KidWall 依赖 user32 切壁纸接口与 Windows 版 VLC 原生库，仅发布 Windows 版本。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v），例如 1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 测试
        run: dotnet test KidWall.slnx -c Release

  publish:
    name: 发布 ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
          - arch: x86
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 计算版本号
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Tag must be a numeric version (for example v1.0.0): $version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "版本：$version"

      - name: 发布（x64 走 NativeAOT；x86 不受 NativeAOT 支持，保持自包含单文件）
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $aotArgs = @()
          $singleFile = "true"
          $trimmed = "false"
          if ($env:ARCH -eq "x64") {
            $singleFile = "false"
            $trimmed = "true"
            $aotArgs = @(
              "-p:PublishAot=true",
              "-p:IlcGenerateCompleteTypeMetadata=true",
              "-p:IlcTrimMetadata=false",
              "-p:IlcSingleThreaded=true"
            )
          }
          dotnet publish src/KidWall.App/KidWall.App.csproj `
            -c Release `
            -f net10.0-windows `
            -r "win-$env:ARCH" `
            --self-contained true `
            @aotArgs `
            -p:PublishSingleFile=$singleFile `
            -p:PublishTrimmed=$trimmed `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:Version=$env:APP_VERSION `
            -o "artifacts/publish/win-$env:ARCH/KidWall.App"
          if ($LASTEXITCODE -ne 0) { throw "publish failed for win-$env:ARCH" }

          # 原生库自带的 pdb 不参与运行，剔除以减小安装包体积
          Get-ChildItem "artifacts/publish/win-$env:ARCH/KidWall.App" -Recurse -File |
            Where-Object { $_.Extension -in ".pdb", ".xml" } |
            Remove-Item -Force

      - name: 构建 Windows 安装包
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: scripts/KidWall.iss
          options: >-
            /DAppVersion=${{ env.APP_VERSION }}
            /DAppArch=${{ matrix.arch }}
            /DSourceDir=${{ github.workspace }}\artifacts\publish\win-${{ matrix.arch }}\KidWall.App
            /DOutputDir=${{ github.workspace }}\artifacts\release

      - name: 计算安装包 SHA-256
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $installerName = "KidWall-v$env:APP_VERSION-win-$env:ARCH-setup.exe"
          $installerPath = Join-Path "artifacts/release" $installerName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Installer was not produced: $installerPath"
          }
          $sha = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $installerName" | Set-Content -LiteralPath "$installerPath.sha256" -Encoding ASCII

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: KidWall-win-${{ matrix.arch }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: KidWall-*
          path: artifacts/release
          merge-multiple: true

      - name: 计算版本号
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
            $tagName = "v$version"
          } else {
            # 沿用被推送的原始标签，避免额外创建新标签。
            $tagName = '${{ github.ref_name }}'
            $version = $tagName.TrimStart('v', 'V')
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 准备发布说明
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 优先使用手工维护的版本说明，否则退回简单的版本标题
          $curated = ".github/release-notes/v$env:VERSION.md"
          $bodyPath = "artifacts/release-body.md"
          New-Item -ItemType Directory -Path (Split-Path -Parent $bodyPath) -Force | Out-Null
          if (Test-Path -LiteralPath $curated -PathType Leaf) {
            Copy-Item -LiteralPath $curated -Destination $bodyPath -Force
            Write-Host "使用发布说明：$curated"
          }
          else {
            "KidWall v$env:VERSION" | Set-Content -LiteralPath $bodyPath -Encoding utf8
            Write-Host "未找到 $curated，将只使用自动生成的变更说明。"
          }

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: KidWall v${{ steps.version.outputs.version }}
          body_path: artifacts/release-body.md
          generate_release_notes: true
          files: |
            artifacts/release/*.exe
            artifacts/release/*.sha256
