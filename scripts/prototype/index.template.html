<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>童壁 KidWall · 儿童桌面壁纸原型</title>
<style>
  :root {
    --bg-1: #1b1440;
    --bg-2: #3b1470;
    --bg-3: #7a1f8f;
    --bg-4: #ff8a5c;
    --ink: #fff;
    --ink-2: rgba(255,255,255,.72);
    --ink-3: rgba(255,255,255,.48);
    --glass: rgba(255,255,255,.10);
    --glass-2: rgba(255,255,255,.16);
    --stroke: rgba(255,255,255,.18);
    --accent: #ffd166;
    --accent-2: #4fd1ff;
    --pink: #ff8fd8;
    --green: #6dffc4;
    --r-lg: 24px;
    --r-md: 16px;
    --shadow: 0 18px 50px rgba(8,4,40,.55);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:"PingFang SC","Microsoft YaHei","YouYuan","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 700px at 20% -10%, rgba(122,31,143,.5), transparent 60%),
      radial-gradient(900px 600px at 110% 30%, rgba(255,138,92,.32), transparent 55%),
      linear-gradient(160deg, #1b1440, #2a0e55 70%, #150a36);
    height:100vh; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* 动态壁纸卡片内闪烁的星星复用此动画 */
  @keyframes twinkle {
    0%,100% { opacity:0; transform:scale(.4); }
    50% { opacity:.9; transform:scale(1.15); }
  }

  /* ---------- 桌面窗口 ---------- */
  .win {
    position:fixed; z-index:10; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:min(1280px,96vw); height:min(820px,90vh);
    display:flex; flex-direction:column;
    background:rgba(26,13,72,.92);
    border:1px solid rgba(255,255,255,.22);
    border-radius:20px; overflow:hidden;
    box-shadow:0 40px 120px rgba(5,2,30,.85), inset 0 1px 0 rgba(255,255,255,.28);
    backdrop-filter:blur(26px) saturate(1.3);
    transition:width .35s ease, height .35s ease, transform .45s cubic-bezier(.3,1,.4,1), opacity .4s;
  }
  .win.min { transform:translate(-50%,calc(100vh - 24px)) scale(.22); opacity:0; pointer-events:none; }
  .win.full { width:100vw; height:100vh; border-radius:0; border:none; }
  .win.closed { opacity:0; transform:translate(-50%,-50%) scale(.82); pointer-events:none; }

  .titlebar {
    height:60px; flex:none; display:flex; align-items:center; gap:18px;
    padding:0 6px 0 18px; user-select:none;
    background:linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.03));
    border-bottom:1px solid var(--stroke);
  }
  .t-app { display:flex; align-items:center; gap:10px; flex:none; }
  .t-app .dot-mark {
    width:34px; height:34px; border-radius:11px; display:grid; place-items:center; font-size:18px;
    background:linear-gradient(135deg,var(--accent),#ff7ab8 55%,var(--accent-2));
    box-shadow:0 0 14px rgba(255,150,170,.55), inset 0 0 8px rgba(255,255,255,.35);
    animation:bob 3.2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-3px) rotate(3deg);} }
  .t-title { font-size:14px; font-weight:700; line-height:1.25; color:#fff; }
  .t-title small { display:block; font-size:10.5px; font-weight:400; color:var(--ink-3); letter-spacing:1px; white-space:nowrap; }
  .t-actions { display:flex; gap:10px; flex:none; }
  .t-actions .btn { padding:8px 15px; font-size:13px; }
  .t-ctrl { margin-left:auto; display:flex; align-items:center; gap:7px; flex:none; padding:0 10px 0 4px; }
  .t-ctrl button {
    position:relative; width:34px; height:34px; border:none; cursor:pointer;
    border-radius:50%; font-size:16px; font-family:inherit;
    display:grid; place-items:center; line-height:1;
    box-shadow:0 3px 8px rgba(0,0,0,.35), inset 0 2px 4px rgba(255,255,255,.45);
    transition:transform .22s cubic-bezier(.2,1.6,.4,1), filter .2s;
    animation:btnIdle 3.2s ease-in-out infinite;
    filter:saturate(1.1);
  }
  .t-ctrl button:nth-child(1){ background:linear-gradient(135deg,#8fe0ff,#3f9bff); animation-delay:0s; }
  .t-ctrl button:nth-child(2){ background:linear-gradient(135deg,#ffe08a,#ff9d5c); animation-delay:.55s; }
  .t-ctrl button:nth-child(3){ background:linear-gradient(135deg,#ffb0dd,#ff5f9e); animation-delay:1.1s; }
  .t-ctrl button:hover { transform:scale(1.25) rotate(-10deg); }
  .t-ctrl button:active { transform:scale(.88) rotate(6deg); }
  /* 用独立 translate 属性做呼吸浮动，避免覆盖 hover 的 transform */
  @keyframes btnIdle { 0%,100%{ translate:0 0; } 50%{ translate:0 -3px; } }

  /* 童趣提示气泡 */
  .t-ctrl button::after {
    content:attr(data-tip);
    position:absolute; top:calc(100% + 9px); left:50%; transform:translate(-50%,-6px);
    background:rgba(24,12,70,.95); border:1px solid rgba(255,255,255,.28);
    color:#fff; font-size:12px; font-weight:600; white-space:nowrap; padding:5px 11px; border-radius:99px;
    opacity:0; pointer-events:none; transition:.2s; z-index:40;
    box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  .t-ctrl button::before {
    content:""; position:absolute; top:calc(100% + 4px); left:50%; margin-left:-4px;
    border:4px solid transparent; border-bottom-color:rgba(24,12,70,.95);
    opacity:0; transition:.2s; z-index:41;
  }
  .t-ctrl button:hover::after { opacity:1; transform:translate(-50%,0); }
  .t-ctrl button:hover::before { opacity:1; }

  /* 点击魔法粒子 */
  .particle {
    position:fixed; z-index:90; pointer-events:none; font-size:15px; font-weight:700;
    text-shadow:0 0 8px rgba(255,255,255,.8);
    animation:popFly .85s ease-out forwards;
  }
  @keyframes popFly {
    0% { transform:translate(-50%,-50%) scale(.4) rotate(0); opacity:1; }
    100% { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.5) rotate(40deg); opacity:0; }
  }

  .win-body { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; }
  .win-body::-webkit-scrollbar { width:8px; }
  .win-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); border-radius:99px; }
  .win-body::-webkit-scrollbar-track { background:transparent; }

  /* ---------- 重新打开 ---------- */
  .reopen {
    position:fixed; z-index:15; left:50%; top:50%;
    transform:translate(-50%,calc(-50% + 20px));
    border:none; cursor:pointer; font-family:inherit; font-size:15px; font-weight:700;
    color:#3a2500; padding:14px 26px; border-radius:999px;
    background:linear-gradient(135deg,var(--accent),#ff9d5c);
    box-shadow:0 12px 34px rgba(255,170,90,.5);
    opacity:0; pointer-events:none; transition:.35s;
  }
  .reopen.show { opacity:1; transform:translate(-50%,-50%); pointer-events:auto; }

  /* ---------- 布局 ---------- */
  .app { position:relative; z-index:1; max-width:1240px; margin:0 auto; padding:0 28px 48px; }

  /* ---------- 搜索框（位于标题栏） ---------- */
  .search {
    flex:1; min-width:160px; max-width:460px; display:flex; align-items:center; gap:10px;
    background:var(--glass); border:1px solid var(--stroke);
    border-radius:999px; padding:9px 18px; backdrop-filter:blur(14px);
    transition:.25s;
  }
  .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 4px rgba(255,209,102,.18); }
  .search input {
    flex:1; background:transparent; border:none; outline:none;
    color:var(--ink); font-size:14px; font-family:inherit;
  }
  .search input::placeholder { color:var(--ink-3); }
  .search svg { width:17px; height:17px; stroke:var(--ink-2); flex:none; }
  .btn {
    border:none; cursor:pointer; font-family:inherit; font-size:14px;
    color:var(--ink); display:inline-flex; align-items:center; gap:8px;
    padding:11px 18px; border-radius:999px;
    background:var(--glass-2); border:1px solid var(--stroke);
    backdrop-filter:blur(12px); transition:.22s;
  }
  .btn:hover { transform:translateY(-2px); background:rgba(255,255,255,.22); }
  .btn.primary {
    background:linear-gradient(135deg,var(--accent),#ff9d5c);
    color:#3a2500; font-weight:700; border:none;
    box-shadow:0 8px 24px rgba(255,170,90,.4);
  }
  .btn.primary:hover { box-shadow:0 12px 30px rgba(255,170,90,.55); }

  /* ---------- 分类导航 ---------- */
  nav.cats { display:flex; gap:10px; flex-wrap:wrap; margin:26px 0 26px; }
  .cat {
    border:none; cursor:pointer; font-family:inherit; font-size:14px;
    color:var(--ink-2); padding:9px 20px; border-radius:999px;
    background:var(--glass); border:1px solid transparent;
    backdrop-filter:blur(10px); transition:.2s;
  }
  .cat:hover { color:#fff; background:var(--glass-2); }
  .cat.active {
    color:#2a1400; font-weight:700;
    background:linear-gradient(135deg,var(--accent),#ff9d5c);
    box-shadow:0 6px 20px rgba(255,180,100,.45);
  }
  .cat .cnt {
    display:inline-block; margin-left:6px; font-size:11px;
    background:rgba(255,255,255,.25); padding:1px 8px; border-radius:99px;
  }
  .cat.active .cnt { background:rgba(42,20,0,.18); }

  /* ---------- 壁纸网格 ---------- */
  .bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .bar h2 { font-size:20px; display:flex; align-items:center; gap:10px; }
  .bar h2::before {
    content:""; width:8px; height:22px; border-radius:4px;
    background:linear-gradient(180deg,var(--accent),var(--pink));
    box-shadow:0 0 12px rgba(255,140,200,.8);
  }
  .bar span { font-size:13px; color:var(--ink-3); }

  .grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
    gap:20px;
  }
  .card {
    position:relative; border-radius:var(--r-lg); overflow:hidden;
    border:1px solid var(--stroke); background:var(--glass);
    backdrop-filter:blur(8px); box-shadow:var(--shadow);
    aspect-ratio:16/9; cursor:pointer; transition:transform .28s, box-shadow .28s;
    isolation:isolate;
  }
  .card:hover { transform:translateY(-6px) scale(1.015); box-shadow:0 26px 60px rgba(8,4,40,.7); }
  .card img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .6s; }
  .card:hover img { transform:scale(1.08); }
  .card .shade {
    position:absolute; inset:0;
    background:linear-gradient(180deg,transparent 40%, rgba(10,5,40,.55) 78%, rgba(10,5,40,.85));
    opacity:.9; transition:.3s;
  }
  .card:hover .shade { opacity:1; }

  /* 动态壁纸徽标 + 播放动效 */
  .badge {
    position:absolute; top:12px; left:12px; z-index:3;
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; color:#fff; padding:5px 12px;
    border-radius:99px; background:rgba(0,0,0,.45);
    backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.25);
  }
  .badge .dot {
    width:8px; height:8px; border-radius:50%;
    background:var(--green); box-shadow:0 0 10px var(--green);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.5);opacity:.6;} }

  .live {
    position:absolute; inset:0; z-index:2; pointer-events:none; opacity:.5;
    mix-blend-mode:screen;
  }
  .live.twinkle i { position:absolute; width:4px; height:4px; border-radius:50%; background:#fff; animation:twinkle 2s infinite; }
  .live.flow { background:linear-gradient(120deg,transparent, rgba(255,255,255,.35), transparent); background-size:200% 100%; animation:flow 3.4s linear infinite; }
  @keyframes flow { from{background-position:200% 0;} to{background-position:-200% 0;} }
  .live.aurora { background:linear-gradient(120deg, rgba(90,220,255,.55), rgba(255,120,200,.55), rgba(120,255,180,.55)); background-size:300% 300%; animation:aurora 5s ease infinite; }
  @keyframes aurora { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }

  /* 卡片底部信息 + 操作 */
  .meta { position:absolute; inset:auto 0 0 0; z-index:3; padding:14px 16px 12px; }
  .meta .name { font-size:15px; font-weight:600; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .meta .tag { font-size:11px; color:var(--ink-2); margin-top:3px; display:block; }
  .ops {
    position:absolute; z-index:4; inset:auto 14px 14px auto;
    display:flex; gap:8px; opacity:0; transform:translateY(8px); transition:.25s;
  }
  .card:hover .ops { opacity:1; transform:translateY(0); }
  .ops .btn { padding:8px 14px; font-size:13px; }
  .ops .btn.set { background:linear-gradient(135deg,var(--accent),#ff9d5c); color:#3a2500; font-weight:700; border:none; box-shadow:0 6px 18px rgba(255,170,90,.5); }

  /* 空状态 */
  .empty {
    display:none; text-align:center; padding:70px 0; color:var(--ink-3);
  }
  .empty.show { display:block; animation:fadeUp .4s; }
  .empty .big { font-size:52px; margin-bottom:10px; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:none;} }

  /* ---------- 预览弹窗 ---------- */
  .modal {
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(10,5,40,.6); backdrop-filter:blur(10px);
  }
  .modal.show { display:flex; animation:fadeIn .25s; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .modal .stage {
    position:relative; width:min(920px,100%); padding-top:54px; background:var(--surface); border-radius:var(--r-lg); overflow:hidden;
    border:1px solid var(--stroke); box-shadow:0 30px 80px rgba(0,0,0,.6);
    animation:pop .3s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from{transform:scale(.92);opacity:0;} to{transform:scale(1);opacity:1;} }
  .stage .imgbox { position:relative; height:518px; margin:0 18px 10px; overflow:hidden; border:1px solid var(--stroke); border-radius:20px; }
  .stage .imgbox img { width:100%; height:100%; object-fit:cover; }
  .stage .info {
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:0 18px 18px; background:var(--surface);
  }
  .stage .info h3 { font-size:17px; }
  .stage .info p { font-size:13px; color:var(--ink-2); margin-top:3px; }
  .stage .info .grow { flex:1; }
  .current-badge { position:absolute; top:12px; right:12px; z-index:5; padding:4px 10px; border-radius:10px; background:var(--primary); color:#fff; font-size:11px; }
  .modal .close {
    position:absolute; top:12px; right:18px; width:34px; height:34px;
    border-radius:50%; border:1px solid var(--stroke); cursor:pointer;
    background:rgba(0,0,0,.4); color:#fff; font-size:18px; backdrop-filter:blur(8px);
    transition:.2s;
  }
  .modal .close:hover { background:rgba(255,255,255,.25); transform:rotate(90deg); }

  /* ---------- 设置抽屉（软件窗口内右侧边栏） ---------- */
  .drawer {
    position:absolute; top:60px; right:0; bottom:0; z-index:60; width:min(400px,92%);
    background:rgba(24,12,70,.94); backdrop-filter:blur(20px);
    border-left:1px solid var(--stroke); border-radius:18px 0 0 18px;
    padding:26px 28px;
    transform:translateX(105%); transition:transform .35s cubic-bezier(.2,1,.3,1);
    overflow-y:auto;
  }
  .drawer.show { transform:translateX(0); }
  .drawer h3 { font-size:18px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .drawer .sub { font-size:13px; color:var(--ink-3); margin-bottom:22px; }
  /* 窗口内遮罩：只变暗软件内容区，不覆盖窗口外 */
  .dimmer {
    position:absolute; top:60px; left:0; right:0; bottom:0; z-index:54;
    background:rgba(10,5,40,.45); backdrop-filter:blur(5px);
    opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .dimmer.show { opacity:1; pointer-events:auto; }
  .row {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:15px 0; border-bottom:1px dashed rgba(255,255,255,.14);
  }
  .row .txt b { display:block; font-size:14px; font-weight:600; }
  .row .txt span { font-size:12px; color:var(--ink-3); }
  .switch {
    width:52px; height:30px; border-radius:99px; border:none; cursor:pointer;
    background:rgba(255,255,255,.2); position:relative; transition:.25s; flex:none;
  }
  .switch::after {
    content:""; position:absolute; top:3px; left:3px; width:24px; height:24px;
    border-radius:50%; background:#fff; transition:.25s; box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .switch.on { background:linear-gradient(135deg,var(--accent),#ff9d5c); }
  .switch.on::after { left:25px; }

  /* ---------- Toast ---------- */
  .toast {
    position:fixed; left:50%; bottom:88px; z-index:80;
    transform:translate(-50%,80px); opacity:0;
    display:flex; align-items:center; gap:10px;
    background:rgba(20,12,60,.95); border:1px solid rgba(255,209,102,.5);
    color:#fff; padding:14px 22px; border-radius:99px; font-size:14px;
    box-shadow:0 14px 40px rgba(0,0,0,.5); transition:.4s cubic-bezier(.2,1.4,.4,1);
    backdrop-filter:blur(12px);
  }
  .toast.show { transform:translate(-50%,0); opacity:1; }
  .toast .tick {
    width:22px; height:22px; border-radius:50%; flex:none;
    background:linear-gradient(135deg,var(--green),#4fd1ff);
    display:grid; place-items:center; font-size:12px; color:#063; font-weight:800;
    box-shadow:0 0 12px rgba(109,255,196,.8);
  }

  /* ---------- 底部 ---------- */
  footer { text-align:center; margin-top:46px; color:var(--ink-3); font-size:12px; letter-spacing:1px; }

  @media (max-width:900px){
    .t-title small { display:none; }
  }
  @media (max-width:720px){
    .win { width:100vw; height:100vh; border-radius:0; border:none; }
    .t-actions { display:none; }
    .titlebar { gap:10px; padding-left:12px; }
    .search { max-width:none; }
    .app { padding:0 16px 40px; }
  }
</style>
<link rel="stylesheet" href="settings.css">
</head>
<body>

<!-- 软件窗口 -->
<div class="win" id="win">
  <div class="titlebar" id="titlebar">
    <div class="t-app">
      <span class="dot-mark">🎈</span>
      <div class="t-title">童壁 KidWall
        <small>儿童桌面壁纸 · 轻量 纯净 无广告</small>
      </div>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
      </svg>
      <input id="search" type="text" data-placeholder-key="Shell.Search.Placeholder" placeholder="搜索喜欢的壁纸，比如：恐龙、星星、独角兽…" />
    </div>

    <div class="title-appearance"><div id="theme-palettes" class="palette-dots" role="listbox"></div><button id="theme-toggle" class="title-icon" type="button"></button><div class="language-picker"><button id="language-toggle" class="title-icon" type="button" aria-haspopup="menu">文</button><div id="language-menu" class="language-menu" role="menu" hidden><button role="menuitem" data-language="zh-CN">简体中文</button><button role="menuitem" data-language="en-US">English</button></div></div></div>
    <div class="t-actions">
      <button class="btn" onclick="openFile()" data-title-key="Shell.Actions.Local">📁</button>
      <button class="btn primary" onclick="openDrawer()" data-title-key="Shell.Actions.Settings">⚙</button>
    </div>

    <div class="t-ctrl">
      <button onclick="minWin(event)" data-tip="睡觉觉 🌙" title="最小化">—</button>
      <button onclick="maxWin(event)" data-tip="变大大 ⭐" title="最大化" id="maxBtn">□</button>
      <button onclick="closeWin(event)" data-tip="拜拜 👋" title="关闭">×</button>
    </div>
  </div>

  <div class="win-body">
    <div class="app">
  <!-- 分类 -->
  <nav class="cats" id="cats"></nav>

  <!-- 壁纸区 -->
  <div class="bar">
    <h2 id="sectionTitle">全部壁纸</h2>
    <span id="countLabel"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <div class="big">🔭</div>
    <div>没有找到匹配的壁纸，换个关键词试试吧～</div>
  </div>

  <footer data-key="Main.Footer.Text"></footer>
    </div><!-- /.app -->
  </div><!-- /.win-body -->

  <!-- 设置抽屉（应用内右侧边栏） -->
  <div class="dimmer" id="drawerDimmer" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <h3>⚙ 简单设置
      <button class="btn" style="margin-left:auto;padding:7px 14px;font-size:13px;" onclick="closeDrawer()">✕ 取消</button>
    </h3>
    <p class="sub" data-key="Settings.Page.Subtitle"></p>
    <div class="row">
      <div class="txt"><b>开机自启</b><span>开机后自动应用上次的壁纸</span></div>
      <button class="switch on" onclick="this.classList.toggle('on')"></button>
    </div>
    <div class="row">
      <div class="txt"><b>定时换壁纸</b><span>每 30 分钟自动换一张</span></div>
      <button class="switch" onclick="this.classList.toggle('on')"></button>
    </div>
    <div class="row">
      <div class="txt"><b>动态壁纸省电模式</b><span data-key="Settings.BatterySaver.Desc"></span></div>
      <button class="switch" disabled aria-disabled="true"></button>
    </div>
    <div class="row">
      <div class="txt"><b>屏蔽不适合内容</b><span data-key="Settings.ContentFilter.Desc"></span></div>
      <button class="switch" disabled aria-disabled="true"></button>
    </div>
    <button class="btn primary" style="width:100%;justify-content:center;margin-top:24px;" onclick="closeDrawer();toast('设置已保存 🎉')">保存设置</button>
    <button class="btn about-link" id="about-open" data-key="About.Title"></button>
  </div>
</div><!-- /.win -->

<button class="reopen" id="reopen" onclick="restoreWin()">🎈 童壁去系统托盘啦，点我重新打开</button>

<!-- 预览弹窗 -->
<div class="modal" id="modal">
  <div class="stage">
    <button class="close" onclick="closeModal()">✕</button>
    <div class="imgbox" id="stageImg"></div>
    <div class="info">
      <div class="grow">
        <h3 id="stageName"></h3>
        <p id="stageTag"></p>
      </div>
      <button class="btn" id="previewFavorite" onclick="toggleFavorite()" data-key="Preview.Labels.Favorite"></button>
      <button class="btn primary" id="previewApply" onclick="apply(previewId)" data-key="Preview.Labels.Apply"></button>
    </div>
  </div>
</div>

<div class="about-overlay" id="about-overlay" role="dialog" aria-modal="true" aria-labelledby="about-title">
 <section class="about-window"><div class="about-head"><b id="about-title" data-key="About.Title"></b><div class="about-controls"><button class="btn" data-about-action="minimize" disabled>−</button><button class="btn" data-about-action="maximize" disabled>□</button><button class="btn" id="about-close" data-about-action="close">✕</button></div></div>
 <div class="about-body"><div class="about-brand"><img src="../logo.png" alt=""><div><h2 data-key="Shell.Window.Title"></h2><p data-key="Shell.Window.Subtitle"></p></div></div>
 <dl class="about-details"><dt data-key="About.AboutVersion"></dt><dd>1.0.8</dd><dt data-key="About.AboutCompileTime"></dt><dd id="about-build-time">2026-10-15 00:00:00</dd><dt data-key="About.AboutPlatform"></dt><dd>.NET 10 · Avalonia 12.1.4</dd><dt data-key="About.Author"></dt><dd data-key="About.AboutAuthorName"></dd></dl>
 <a class="btn" href="https://github.com/dotnet9/KidWall" target="_blank" rel="noopener" data-key="About.Repository"></a><hr>
 <p data-key="About.AboutUpdateDescription"></p><button class="btn primary" id="update-action"></button> <button class="btn" id="update-cancel" data-key="About.AboutCancel" hidden></button>
 <progress id="update-progress" hidden></progress><p id="update-status" role="status"></p><small data-key="About.Copyright"></small>
 </div></section>

<div class="toast" id="toast"><span class="tick">✓</span><span id="toastText">已设为桌面壁纸</span></div>

<script src="resources.js"></script>
<script>
/* ---------------- 壁纸数据 ---------------- */
const WALLPAPERS = [
  { id:1, cat:"卡通", name:"小恐龙气球派对", tag:"cartoon", img:"../res/cartoon/01-dino-balloons.jpg",
    live:null },

    live:"aurora" },
  { id:5, cat:"卡通", name:"彩虹独角兽", tag:"cartoon", img:"../res/cartoon/02-unicorn-rainbow.jpg",
    live:null },
  { id:6, cat:"星空", name:"火箭出发啦", tag:"starry", img:"../res/starry/02-rocket-space.jpg",
    live:"twinkle" },
  { id:7, cat:"插画", name:"海底小世界", tag:"illustration", img:"../res/illustration/02-underwater.jpg",
    live:null },
  { id:8, cat:"动态", name:"星光流转", tag:"dynamic", img:"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%3E%3Cstop%20stop-color%3D%22%232e1065%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230e7490%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20fill%3D%22url%28%23g%29%22%20d%3D%22M0%200h640v360H0z%22/%3E%3Cg%20fill%3D%22%23ffd166%22%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%2270%22%20r%3D%223%22/%3E%3Ccircle%20cx%3D%22400%22%20cy%3D%22100%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22520%22%20cy%3D%22240%22%20r%3D%223%22/%3E%3C/g%3E%3C/svg%3E",
    live:"flow" },
  { id:9, cat:"卡通", name:"小猫睡午觉", tag:"cartoon", img:"../res/cartoon/03-kitten-nap.jpg",
    live:null },
  { id:10, cat:"星空", name:"银河滑滑梯", tag:"starry", img:"../res/starry/03-galaxy-slide.jpg",
    live:"flow" },
  { id:11, cat:"插画", name:"云上城堡", tag:"illustration", img:"../res/illustration/03-cloud-castle.jpg",
    live:null },
  { id:12, cat:"动态", name:"星星雨", tag:"dynamic", img:"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%3E%3Cstop%20stop-color%3D%22%232e1065%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230e7490%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20fill%3D%22url%28%23g%29%22%20d%3D%22M0%200h640v360H0z%22/%3E%3Cg%20fill%3D%22%23ffd166%22%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%2270%22%20r%3D%223%22/%3E%3Ccircle%20cx%3D%22400%22%20cy%3D%22100%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22520%22%20cy%3D%22240%22%20r%3D%223%22/%3E%3C/g%3E%3C/svg%3E",
    live:"twinkle" },
  { id:13, cat:"卡通", name:"企鹅去南极", tag:"cartoon", img:"../res/cartoon/04-penguin-ice.jpg",
    live:null },
  { id:14, cat:"插画", name:"星空鲸鱼", tag:"illustration", img:"../res/illustration/04-whale-stars.jpg",
    live:"aurora" },
  { id:15, cat:"动态", name:"彩虹泡泡", tag:"dynamic", img:"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22640%22%20height%3D%22360%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%3E%3Cstop%20stop-color%3D%22%232e1065%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230e7490%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20fill%3D%22url%28%23g%29%22%20d%3D%22M0%200h640v360H0z%22/%3E%3Cg%20fill%3D%22%23ffd166%22%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%2270%22%20r%3D%223%22/%3E%3Ccircle%20cx%3D%22400%22%20cy%3D%22100%22%20r%3D%224%22/%3E%3Ccircle%20cx%3D%22520%22%20cy%3D%22240%22%20r%3D%223%22/%3E%3C/g%3E%3C/svg%3E",
    live:"flow" },
  { id:16, cat:"卡通", name:"机器人小帮手", tag:"cartoon", img:"../res/cartoon/05-robot-flower.jpg",
    live:null },
];

const CATS = ["全部","推荐","卡通","星空","插画","动态壁纸","收藏","本地"];
const CAT_MAP = { "卡通":"卡通", "星空":"星空", "插画":"插画", "动态壁纸":"动态" };
const CAT_EMOJI = { "全部":"🪄","推荐":"🌟","卡通":"🐣","星空":"🌙","插画":"🎨","动态壁纸":"🎞️","收藏":"💛","本地":"📁" };
const CAT_KEYS = { "全部":"All","推荐":"Recommended","卡通":"Cartoon","星空":"Starry","插画":"Illustration","动态壁纸":"Dynamic","动态":"Dynamic","收藏":"Favorites","本地":"Local" };
const recommend = [1,4,6,10,12,14];
const text = key => key.split('.').reduce((value, part) => value?.[part], window.KIDWALL_RESOURCES[document.documentElement.lang || 'zh-CN'].Localization) ?? key;
let favorites = new Set();
let currentId = null;
let previewId = null;
try {
  const saved = JSON.parse(localStorage.getItem('kidwall-gallery') || '{}');
  favorites = new Set(Array.isArray(saved.favorites) ? saved.favorites : []);
  currentId = saved.currentId ?? null;
} catch { /* 浏览器不允许本地存储时仍可在当前页面操作。 */ }
function saveGallery(){
  try { localStorage.setItem('kidwall-gallery', JSON.stringify({ favorites:[...favorites], currentId })); } catch {}
}

/* ---------------- 渲染 ---------------- */
let currentCat = "全部";
let keyword = "";

function matchCat(w){
  if(currentCat==="全部") return true;
  if(currentCat==="推荐") return recommend.includes(w.id);
  if(currentCat==="收藏") return favorites.has(w.id);
  if(currentCat==="本地") return w.local === true;
  return w.cat === CAT_MAP[currentCat];
}

function renderCats(){
  document.getElementById("cats").innerHTML = CATS.map(c=>{
    const count = c==="全部" ? WALLPAPERS.length
      : c==="推荐" ? recommend.length
      : c==="收藏" ? WALLPAPERS.filter(w=>favorites.has(w.id)).length
      : c==="本地" ? WALLPAPERS.filter(w=>w.local).length
      : WALLPAPERS.filter(w=>w.cat===CAT_MAP[c]).length;
    return `<button class="cat ${c===currentCat?"active":""}" data-cat="${c}"
      onclick="currentCat='${c}';renderCats();renderGrid()">${CAT_EMOJI[c]} <span data-key="Main.Categories.${CAT_KEYS[c]}">${text('Main.Categories.'+CAT_KEYS[c])}</span><span class="cnt">${count}</span></button>`;
  }).join("");
}

function liveHTML(kind){
  if(!kind) return "";
  let inner = "";
  if(kind==="twinkle") inner = [...Array(10)].map(()=>`<i style="left:${Math.random()*90+5}%;top:${Math.random()*80+10}%;animation-delay:${(Math.random()*2).toFixed(1)}s"></i>`).join("");
  return `<div class="live ${kind}">${inner}</div>`;
}

function renderGrid(){
  const list = WALLPAPERS.filter(w=>matchCat(w) && (!keyword || (w.name+w.tag+w.cat+text('Main.Categories.'+CAT_KEYS[w.cat])).toLocaleLowerCase().includes(keyword.toLocaleLowerCase())));
  document.getElementById("countLabel").textContent = text('Main.Labels.Count').replace('{0}',list.length);
  document.getElementById("sectionTitle").textContent = `${CAT_EMOJI[currentCat]} ${text('Main.Section.'+CAT_KEYS[currentCat])}`;
  document.getElementById("empty").classList.toggle("show", list.length===0);
  document.getElementById("grid").innerHTML = list.map(w=>`
    <div class="card" onclick="openModal(${w.id})">
      <img src="${w.img}" alt="${w.name}" loading="lazy">
      ${w.cat==="动态"?`<div class="badge"><span class="dot"></span><span data-key="Main.Card.Dynamic">${text('Main.Card.Dynamic')}</span></div>`:""}
      ${w.id===currentId?`<div class="current-badge" data-key="Main.Card.Current">${text('Main.Card.Current')}</div>`:""}
      ${liveHTML(w.live)}
      <div class="shade"></div>
      <div class="meta">
        <span class="name">${w.name}</span>
        <span class="tag">${text('Main.Categories.'+CAT_KEYS[w.cat])} · #${w.tag}</span>
      </div>
      <div class="ops" onclick="event.stopPropagation()">
        <button class="btn" onclick="openModal(${w.id})">👁 <span data-key="Main.Card.Preview">${text('Main.Card.Preview')}</span></button>
        <button class="btn set" onclick="apply(${w.id})">✨ <span data-key="Main.Card.SetWallpaper">${text('Main.Card.SetWallpaper')}</span></button>
      </div>
    </div>`).join("");
}

/* ---------------- 交互 ---------------- */
function openModal(id){
  const w = WALLPAPERS.find(x=>x.id===id);
  if (!w) return;
  previewId = id;
  document.getElementById("stageImg").innerHTML = `
    <img src="${w.img}" alt="${w.name}">${liveHTML(w.live)}
    <div class="shade"></div>
    ${w.cat==="动态"?`<span class="badge"><span class="dot"></span><span data-key="Main.Card.Dynamic">${text('Main.Card.Dynamic')}</span></span>`:""}`;
  document.getElementById("stageName").textContent = w.name;
  document.getElementById("stageTag").textContent = `${text('Main.Categories.'+CAT_KEYS[w.cat])} · #${w.tag} · ${text('Preview.Labels.Resolution')}`;
  const favorite = document.getElementById('previewFavorite');
  favorite.dataset.key = favorites.has(id) ? 'Preview.Labels.Favorited' : 'Preview.Labels.Favorite';
  favorite.textContent = text(favorite.dataset.key);
  document.getElementById("modal").classList.add("show");
}
function closeModal(){ document.getElementById("modal").classList.remove("show"); previewId = null; }
function toggleFavorite(){
  if (previewId === null) return;
  const w = WALLPAPERS.find(item=>item.id===previewId);
  if(favorites.has(previewId)) favorites.delete(previewId); else favorites.add(previewId);
  saveGallery(); renderCats(); renderGrid(); openModal(previewId);
  toast(text(favorites.has(previewId)?'Toast.Messages.FavoriteAdded':'Toast.Messages.FavoriteRemoved').replace('{0}',w.name));
}
function openDrawer(){ document.getElementById("drawer").classList.add("show"); document.getElementById("drawerDimmer").classList.add("show"); }
function closeDrawer(){ document.getElementById("drawer").classList.remove("show"); document.getElementById("drawerDimmer").classList.remove("show"); }
function openFile(){ toast("已打开本地文件夹选择器（原型示意）"); }

let toastTimer;
function apply(id){
  const w = WALLPAPERS.find(item=>item.id===id);
  if(!w) return;
  currentId = id; saveGallery(); renderGrid();
  toast(text('Toast.Messages.Applied').replace('{0}',w.name));
}
window.refreshWallpaperText = () => { renderCats(); renderGrid(); if(previewId!==null)openModal(previewId); };
function toast(text){
  document.getElementById("toastText").textContent = text;
  const t = document.getElementById("toast");
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

document.getElementById("search").addEventListener("input", e=>{
  keyword = e.target.value.trim();
  renderGrid();
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeModal(); closeDrawer(); } });
document.getElementById("modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeModal(); });

/* ---------------- 窗口控制 ---------------- */
/* 点击窗口按钮时喷出魔法星星 */
function winBtn(e){
  if(!e || !e.currentTarget) return;
  const r = e.currentTarget.getBoundingClientRect();
  const emojis = ["✨","🌟","💫","⭐","🌈"];
  for(let i=0;i<9;i++){
    const s = document.createElement("span");
    s.className = "particle";
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = (r.left + r.width/2) + "px";
    s.style.top = (r.top + r.height/2) + "px";
    s.style.setProperty("--dx", (Math.random()*140-70) + "px");
    s.style.setProperty("--dy", (Math.random()*-90-30) + "px");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 880);
  }
}
function minWin(e){
  winBtn(e);
  const w = document.getElementById("win");
  w.classList.remove("closed");
  w.classList.add("min");
  document.getElementById("reopen").classList.add("show");
  setTimeout(()=>toast("🌙 月亮睡着了，童壁先去睡一觉～"), 200);
}
function maxWin(e){
  winBtn(e);
  const w = document.getElementById("win");
  const full = w.classList.toggle("full");
  w.classList.remove("min","closed");
  const btn = document.getElementById("maxBtn");
  btn.setAttribute("data-tip", full ? "变回小窝 🏠" : "变大大 ⭐");
  toast(full ? "✨ 变大大啦！" : "🐣 变回小窝～");
}
function closeWin(e){
  winBtn(e);
  const w = document.getElementById("win");
  w.classList.remove("min");
  w.classList.add("closed");
  document.getElementById("reopen").classList.add("show");
  toast("👋 拜拜～童壁去托盘玩啦（点中间按钮恢复）");
}
function restoreWin(){
  const w = document.getElementById("win");
  w.classList.remove("min","closed","full");
  document.getElementById("maxBtn").innerHTML = "□";
  document.getElementById("maxBtn").setAttribute("data-tip","变大大 ⭐");
  document.getElementById("reopen").classList.remove("show");
  toast("🎈 童壁醒啦！");
}
/* 双击标题栏最大化（桌面应用惯例） */
document.getElementById("titlebar").addEventListener("dblclick", e=>{
  if(!e.target.closest(".t-ctrl")) maxWin();
});

renderCats(); renderGrid();
</script>
